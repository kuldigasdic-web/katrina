<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google model-viewer bibliotēka -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      body { margin: 0; }
      model-viewer {
        width: 100vw;
        height: 100vh;
      }
      #ar-button {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 28px;
        background-color: #007aff;
        color: white;
        border: none;
        border-radius: 30px;
        font-weight: bold;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <!-- 
      ar: ieslēdz AR režīmu
      ar-modes: izmanto sistēmas rīkus (WebXR, Scene Viewer, QuickLook)
      camera-controls: ļauj grozīt 3D modeli ekrānā pirms nolikšanas uz grīdas
    -->
    <model-viewer 
      src="./modelkatrina1.glb" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="pan-y" 
      alt="3D modelis">
      <button slot="ar-button" id="ar-button">
        👋 Skatīt manā telpā (AR)
      </button>
    </model-viewer>
  </body>
</html>
